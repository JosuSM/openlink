services:
  - type: web
    name: openlink-server
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: OPENLINK_SESSION_TTL_MS
        value: 900000
      - key: OPENLINK_ENCOUNTER_TTL_MS
        value: 86400000
